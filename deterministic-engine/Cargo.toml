[package]
name = "deterministic_engine"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = { version = "0.1.7", optional = true }
pqcrypto-kyber = { version = "0.8.1", features = ["bundled"] }
pqcrypto-traits = "0.3.5"
getrandom = { version = "0.3", features = ["wasm_js"] }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"