[package]
name = "deterministic_engine"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = { version = "0.1.7", optional = true }

# Use 'getrandom' 0.2.x which has the 'js' feature
getrandom = { version = "0.2", features = ["js"] }

# Use the 'precomputed-hash' or 'wasm' features if available for pqcrypto
pqcrypto-kyber = "0.8"
pqcrypto-traits = "0.3"

[profile.release]
opt-level = "s"
lto = true