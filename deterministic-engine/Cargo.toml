[package]
name = "deterministic_engine"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Core bindings
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = { version = "0.1.7", optional = true }

# Cryptography - Pure Rust, NIST FIPS 203 compliant
ml-kem = "0.2"
kem = "0.2"

# Randomness for Key Gen & Encapsulation
rand = { version = "0.8", features = ["small_rng"] }
getrandom = { version = "0.2", features = ["js"] }

[features]
default = ["console_error_panic_hook"]

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
codegen-units = 1