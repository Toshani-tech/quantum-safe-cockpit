[package]
name = "security-kernel"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# The bridge between Rust and JavaScript
wasm-bindgen = "0.2"

# Allows us to use high-performance JS types (like BigInt for math)
js-sys = "0.3"

# helps with debugging
console_error_panic_hook = "0.1.7"