<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q-Safe Stealth Cockpit | Avionics v1.0</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="vfx-layer"></div>

    <div id="cockpit-container">
        <header>
            <div id="security-tag">SYSTEM: STANDBY [PQC-ACTIVE]</div>
        </header>

        <main class="pfd-grid">
            <section class="panel" id="air-data-panel">
                <div class="label">PRIMARY FLIGHT DATA</div>
                <canvas id="flight-display"></canvas>
            </section>

            <section class="panel center-panel" id="lattice-panel">
                <div class="label">QUANTUM LATTICE CORE</div>
                <canvas id="lattice-canvas"></canvas>
            </section>

            <section class="panel" id="security-panel">
                <div class="label">ENCRYPTED TELEMETRY LOG</div>
                <div id="terminal-box"></div>
                <div id="boot-terminal" style="display:none;"></div>
            </section>
        </main>

        <footer>
            <button id="init-btn">INITIALIZE FLIGHT DECK</button>
        </footer>
    </div>

    <script type="module" src="./src/main.js"></script>
</body>
</html>
